[project]
name = "ideataste"
version = "0.1.0"
description = "IdeaTaste: Can LLMs Match the Research Taste of Human Researchers?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14",
    "pyyaml>=6",
    "httpx>=0.27",
    "sentence-transformers>=3",
    "huggingface_hub>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ideataste = "ideataste.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideataste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
